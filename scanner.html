<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#F5F1EA" />
<title>Stashify Scanner</title>
<link rel="manifest" href="data:application/json,{
  &quot;name&quot;: &quot;Stashify Scanner&quot;,
  &quot;short_name&quot;: &quot;Scanner&quot;,
  &quot;start_url&quot;: &quot;.&quot;,
  &quot;display&quot;: &quot;standalone&quot;,
  &quot;background_color&quot;: &quot;#F5F1EA&quot;,
  &quot;theme_color&quot;: &quot;#6B7D6D&quot;
}" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'%3E%3Crect width='500' height='500' rx='80' fill='%23EDE8DF'/%3E%3Crect x='90' y='310' width='90' height='80' rx='10' fill='%238A9E8C'/%3E%3Crect x='205' y='310' width='90' height='80' rx='10' fill='%23A8BA9A'/%3E%3Crect x='320' y='310' width='90' height='80' rx='10' fill='%238A9E8C'/%3E%3Crect x='147' y='215' width='90' height='85' rx='10' fill='%23B8956A'/%3E%3Crect x='263' y='215' width='90' height='85' rx='10' fill='%23CEAD87'/%3E%3Crect x='200' y='120' width='100' height='84' rx='10' fill='%23C4B49A'/%3E%3Ccircle cx='390' cy='108' r='22' fill='%236B7D6D'/%3E%3C/svg%3E" />
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --creme:      #F5F1EA;
  --creme2:     #EDE8DF;
  --creme3:     #E3DDD4;
  --sage:       #8A9E8C;
  --sage-light: #A8BA9A;
  --sage-dark:  #6B7D6D;
  --clay:       #B8956A;
  --ink:        #2E2B26;
  --ink2:       #6B6358;
  --ink3:       #A09890;
  --surface:    #FAF8F4;
  --border:     rgba(138,158,140,0.20);
  --border2:    rgba(138,158,140,0.35);
  --radius:     10px;
  --radius-lg:  16px;
  --green:      #4CAF50;
  --red:        #E57373;
  --font:       'Inter', system-ui, sans-serif;
}

body {
  font-family: var(--font);
  background: var(--creme);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* ── Login ── */
#loginScreen {
  position: fixed; inset: 0;
  background: var(--creme);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; padding: 1.5rem;
}
.login-box {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 2rem 1.75rem;
  width: 100%; max-width: 360px;
  box-shadow: 0 8px 32px rgba(44,40,32,0.10);
}
.login-logo {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-bottom: 1.75rem;
}
.login-wordmark {
  font-size: 20px; font-weight: 700; letter-spacing: 0.2em;
  color: var(--sage-dark); text-transform: uppercase;
}
.login-field { margin-bottom: 1rem; }
.login-field label {
  display: block; font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--ink3); margin-bottom: 5px;
}
.login-field input {
  width: 100%; height: 44px; padding: 0 14px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  background: var(--surface); font-size: 15px; color: var(--ink);
  outline: none; font-family: var(--font);
}
.login-field input:focus { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(138,158,140,0.15); }
.login-btn {
  width: 100%; height: 46px; background: var(--sage); color: white;
  border: none; border-radius: var(--radius); font-size: 15px;
  font-weight: 500; cursor: pointer; margin-top: 0.5rem;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font);
}
.login-btn:active { background: var(--sage-dark); }
.login-error {
  background: #FDF0F0; border: 1px solid rgba(139,58,58,0.25);
  border-radius: var(--radius); padding: 10px 14px; font-size: 13px;
  color: #7A3030; margin-top: 0.75rem; display: none;
}

/* ── App Shell ── */
#app { display: none; flex-direction: column; min-height: 100dvh; }

/* ── Top Bar ── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  padding: 0 1rem;
  height: 56px;
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 50;
  flex-shrink: 0;
}
.topbar-logo { display: flex; align-items: center; gap: 8px; }
.topbar-wordmark { font-size: 15px; font-weight: 700; letter-spacing: 0.18em; color: var(--sage-dark); text-transform: uppercase; }
.topbar-sub { font-size: 11px; color: var(--ink3); letter-spacing: 0.04em; margin-left: 2px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); transition: background 0.3s; flex-shrink: 0; }
.status-dot.online { background: var(--green); }
.logout-btn {
  background: none; border: 1px solid var(--border2); border-radius: 8px;
  color: var(--ink3); font-size: 12px; height: 30px; padding: 0 10px;
  cursor: pointer; font-family: var(--font);
}

/* ── Content ── */
.content { flex: 1; padding: 1.25rem 1rem; max-width: 480px; margin: 0 auto; width: 100%; }

/* ── Mode Tabs ── */
.mode-tabs {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 6px; margin-bottom: 1.5rem;
}
.mode-tab {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 10px 6px;
  text-align: center; cursor: pointer; transition: all 0.15s;
  font-size: 12px; color: var(--ink2); line-height: 1.4;
  font-family: var(--font);
}
.mode-tab .tab-icon { font-size: 22px; display: block; margin-bottom: 4px; }
.mode-tab.active { background: var(--sage); border-color: var(--sage); color: white; }
.mode-tab:active { transform: scale(0.97); }

/* ── Cards ── */
.card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius-lg); padding: 1.25rem;
  margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(44,40,32,0.05);
}
.card-title {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink3); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 6px;
}
.card-title .step-badge {
  width: 20px; height: 20px; border-radius: 50%; background: var(--sage);
  color: white; font-size: 11px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.card.done { border-color: var(--sage); background: rgba(138,158,140,0.06); }
.card.done .card-title { color: var(--sage-dark); }

/* ── Scan Button ── */
.scan-btn {
  width: 100%; height: 52px; background: var(--sage); color: white;
  border: none; border-radius: var(--radius); font-size: 15px;
  font-weight: 500; cursor: pointer; display: flex; align-items: center;
  justify-content: center; gap: 10px; font-family: var(--font);
  transition: background 0.15s;
}
.scan-btn:active { background: var(--sage-dark); }
.scan-btn.secondary {
  background: var(--surface); color: var(--ink2);
  border: 1px solid var(--border2);
}
.scan-btn.secondary:active { background: var(--creme2); }

/* ── Scanner Overlay ── */
#scannerOverlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.92); z-index: 200;
  flex-direction: column; align-items: center; justify-content: center;
}
#scannerOverlay.active { display: flex; }
#reader { width: min(90vw, 340px); border-radius: 12px; overflow: hidden; }
.scanner-label {
  color: white; font-size: 14px; margin-bottom: 1.25rem;
  letter-spacing: 0.05em; text-align: center; padding: 0 1rem;
  opacity: 0.9;
}
.scanner-cancel {
  margin-top: 1.5rem; background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3); color: white;
  border-radius: var(--radius); height: 44px; padding: 0 24px;
  font-size: 14px; cursor: pointer; font-family: var(--font);
}
.scanner-corner {
  position: absolute; width: min(90vw, 340px); height: min(90vw, 340px);
  pointer-events: none;
}
.scanner-corner::before, .scanner-corner::after,
.scanner-corner-br::before, .scanner-corner-br::after {
  content: ''; position: absolute; width: 28px; height: 28px;
  border-color: var(--sage-light); border-style: solid;
}
.scanner-corner::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
.scanner-corner::after  { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
.scanner-corner-br::before { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
.scanner-corner-br::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

/* ── Result Display ── */
.result-value {
  font-size: 18px; font-weight: 600; color: var(--ink);
  background: var(--creme2); border-radius: var(--radius);
  padding: 12px 14px; margin: 8px 0; text-align: center;
  border: 1px solid var(--border2); word-break: break-all;
  min-height: 50px; display: flex; align-items: center; justify-content: center;
}
.result-value.empty { color: var(--ink3); font-size: 14px; font-weight: 400; }

.slot-info {
  border-radius: var(--radius); padding: 10px 14px;
  margin: 6px 0; font-size: 13px; line-height: 1.6;
}
.slot-info.occupied { background: rgba(184,149,106,0.12); border: 1px solid rgba(184,149,106,0.3); }
.slot-info.free     { background: rgba(138,158,140,0.10); border: 1px solid rgba(138,158,140,0.25); }
.slot-info-label    { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); margin-bottom: 3px; }

/* ── Action Button ── */
.action-btn {
  width: 100%; height: 54px; border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--font); transition: all 0.15s; margin-top: 4px;
}
.action-btn.confirm { background: var(--sage); color: white; }
.action-btn.confirm:active { background: var(--sage-dark); }
.action-btn.confirm:disabled { opacity: 0.45; cursor: not-allowed; }
.action-btn.reset { background: var(--surface); color: var(--ink3); border: 1px solid var(--border2); margin-top: 8px; height: 42px; font-size: 14px; font-weight: 400; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--creme); padding: 12px 22px;
  border-radius: 999px; font-size: 13px; z-index: 300;
  opacity: 0; transition: opacity 0.2s; white-space: nowrap;
  pointer-events: none; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; }
.toast.success { background: var(--sage-dark); }
.toast.error   { background: #8B3A3A; }

/* ── Arrow ── */
.transfer-arrow {
  text-align: center; font-size: 26px; color: var(--sage); margin: -4px 0; line-height: 1;
}

/* ── Manual Input ── */
.manual-row { display: flex; gap: 8px; margin-top: 8px; }
.manual-input {
  flex: 1; height: 44px; padding: 0 12px;
  border: 1px solid var(--border2); border-radius: var(--radius);
  background: var(--surface); font-size: 14px; color: var(--ink);
  outline: none; font-family: var(--font);
}
.manual-input:focus { border-color: var(--sage); }
.manual-confirm {
  height: 44px; padding: 0 14px; background: var(--sage); color: white;
  border: none; border-radius: var(--radius); cursor: pointer;
  font-size: 14px; font-family: var(--font); white-space: nowrap;
}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <svg width="30" height="30" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <rect width="500" height="500" rx="80" fill="#EDE8DF"/>
        <rect x="90" y="310" width="90" height="80" rx="10" fill="#8A9E8C"/>
        <rect x="205" y="310" width="90" height="80" rx="10" fill="#A8BA9A"/>
        <rect x="320" y="310" width="90" height="80" rx="10" fill="#8A9E8C"/>
        <rect x="147" y="215" width="90" height="85" rx="10" fill="#B8956A"/>
        <rect x="263" y="215" width="90" height="85" rx="10" fill="#CEAD87"/>
        <rect x="200" y="120" width="100" height="84" rx="10" fill="#C4B49A"/>
        <circle cx="390" cy="108" r="22" fill="#6B7D6D"/>
        <polyline points="390,121 390,97" fill="none" stroke="#FAF8F4" stroke-width="3.5" stroke-linecap="round"/>
        <polyline points="382,106 390,97 398,106" fill="none" stroke="#FAF8F4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="login-wordmark">STASHIFY</span>
    </div>
    <div class="login-field">
      <label>E-Mail</label>
      <input type="email" id="loginEmail" placeholder="name@firma.de" autocomplete="email" />
    </div>
    <div class="login-field">
      <label>Passwort</label>
      <input type="password" id="loginPassword" placeholder="••••••••" />
    </div>
    <button class="login-btn" id="loginBtn">🔑 Anmelden</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ── App ── -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">
      <svg width="26" height="26" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <rect width="500" height="500" rx="80" fill="#EDE8DF"/>
        <rect x="90" y="310" width="90" height="80" rx="10" fill="#8A9E8C"/>
        <rect x="205" y="310" width="90" height="80" rx="10" fill="#A8BA9A"/>
        <rect x="320" y="310" width="90" height="80" rx="10" fill="#8A9E8C"/>
        <rect x="147" y="215" width="90" height="85" rx="10" fill="#B8956A"/>
        <rect x="200" y="120" width="100" height="84" rx="10" fill="#C4B49A"/>
        <circle cx="390" cy="108" r="22" fill="#6B7D6D"/>
      </svg>
      <div>
        <div class="topbar-wordmark">STASHIFY</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="status-dot" id="statusDot"></span>
      <button class="logout-btn" id="logoutBtn">Abmelden</button>
    </div>
  </div>

  <div class="content">
    <!-- Mode Tabs -->
    <div class="mode-tabs">
      <div class="mode-tab active" id="tab-einlagern" onclick="setMode('einlagern')">
        <span class="tab-icon">📦</span>Einlagern
      </div>
      <div class="mode-tab" id="tab-umlagern" onclick="setMode('umlagern')">
        <span class="tab-icon">🔄</span>Umlagern
      </div>
      <div class="mode-tab" id="tab-auslagern" onclick="setMode('auslagern')">
        <span class="tab-icon">🚚</span>Auslagern
      </div>
    </div>

    <div id="modeContent"></div>
  </div>
</div>

<!-- ── Scanner Overlay ── -->
<div id="scannerOverlay">
  <div class="scanner-corner"></div>
  <div class="scanner-corner-br"></div>
  <div class="scanner-label" id="scannerLabel">QR-Code scannen</div>
  <div id="reader"></div>
  <button class="scanner-cancel" id="scannerCancel">Abbrechen</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp }                          from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, set, remove, onValue, get } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
                                                  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

// ── Firebase ──────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCt1YcCkBeShjYj_xBpNjiNFmCuXwYRqi4",
  authDomain: "stashing-21ec0.firebaseapp.com",
  databaseURL: "https://stashing-21ec0-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "stashing-21ec0",
  storageBucket: "stashing-21ec0.firebasestorage.app",
  messagingSenderId: "957031728508",
  appId: "1:957031728508:web:4f3a2e81e035b4ac8190f9"
};
const fbApp = initializeApp(firebaseConfig);
const db    = getDatabase(fbApp);
const auth  = getAuth(fbApp);

// ── State ─────────────────────────────────────────────────────
let currentMode  = "einlagern";
let lagerData    = {};
let rowConfig    = [];
let scanCallback = null;
let html5Qr      = null;

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, type = "") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (type ? " " + type : "");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 2800);
}

// ── Firebase Listeners ────────────────────────────────────────
function startListeners() {
  onValue(ref(db, "lager/slots"), snap => {
    lagerData = snap.val() || {};
    document.getElementById("statusDot").classList.add("online");
    refreshMode();
  });
  onValue(ref(db, "lager/rowConfig"), snap => {
    const saved = snap.val();
    if (saved && Array.isArray(saved)) rowConfig = saved;
    refreshMode();
  });
}

function saveSlot(key, value) {
  if (value) return set(ref(db, "lager/slots/" + key), value);
  else       return remove(ref(db, "lager/slots/" + key));
}

// QR-Code format: "STASHIFY:slot:0_2"  or  "STASHIFY:palette:MyPalette"
function parseQR(raw) {
  if (!raw) return null;
  if (raw.startsWith("STASHIFY:slot:"))    return { type: "slot",    value: raw.replace("STASHIFY:slot:", "") };
  if (raw.startsWith("STASHIFY:palette:")) return { type: "palette", value: raw.replace("STASHIFY:palette:", "") };
  // Fallback: treat any raw value as a palette identifier
  return { type: "palette", value: raw };
}

function keyToLabel(key) {
  if (!key) return key;
  const [ri, si] = key.split("_").map(Number);
  if (rowConfig[ri]) return rowConfig[ri].name + " · Platz " + (si + 1);
  return "Platz " + key;
}

function getSlotByKey(key) { return lagerData[key] || null; }

// ── Scanner ───────────────────────────────────────────────────
function startScan(label, onResult) {
  scanCallback = onResult;
  document.getElementById("scannerLabel").textContent = label;
  document.getElementById("scannerOverlay").classList.add("active");

  if (html5Qr) {
    html5Qr.clear().catch(() => {});
    html5Qr = null;
  }
  html5Qr = new Html5Qrcode("reader");
  html5Qr.start(
    { facingMode: "environment" },
    { fps: 12, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 },
    decoded => {
      stopScan();
      if (scanCallback) { const cb = scanCallback; scanCallback = null; cb(decoded); }
    },
    () => {}
  ).catch(err => {
    stopScan();
    toast("Kamera nicht verfügbar – bitte manuell eingeben", "error");
  });
}

function stopScan() {
  document.getElementById("scannerOverlay").classList.remove("active");
  if (html5Qr) { html5Qr.stop().then(() => { html5Qr.clear(); html5Qr = null; }).catch(() => {}); }
}

document.getElementById("scannerCancel").onclick = () => { scanCallback = null; stopScan(); };

// ── Auth ──────────────────────────────────────────────────────
document.getElementById("loginBtn").onclick = async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const pw    = document.getElementById("loginPassword").value;
  const err   = document.getElementById("loginError");
  const btn   = document.getElementById("loginBtn");
  if (!email || !pw) { err.textContent = "Bitte E-Mail und Passwort eingeben."; err.style.display = "block"; return; }
  btn.disabled = true; btn.textContent = "Anmelden…"; err.style.display = "none";
  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch(e) {
    btn.disabled = false; btn.textContent = "🔑 Anmelden";
    const msgs = { "auth/invalid-credential": "E-Mail oder Passwort falsch.", "auth/too-many-requests": "Zu viele Versuche." };
    err.textContent = msgs[e.code] || "Fehler beim Anmelden."; err.style.display = "block";
  }
};
document.getElementById("loginPassword").addEventListener("keydown", e => { if(e.key==="Enter") document.getElementById("loginBtn").click(); });
document.getElementById("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (user) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    startListeners();
    setMode("einlagern");
    toast("Willkommen, " + user.email.split("@")[0] + " 👋", "success");
  } else {
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }
});

// ── Mode Routing ──────────────────────────────────────────────
window.setMode = function(mode) {
  currentMode = mode;
  document.querySelectorAll(".mode-tab").forEach(t => t.classList.remove("active"));
  document.getElementById("tab-" + mode).classList.add("active");
  renderMode();
};

function refreshMode() { if (currentMode) renderMode(); }

function renderMode() {
  if      (currentMode === "einlagern") renderEinlagern();
  else if (currentMode === "umlagern")  renderUmlagern();
  else if (currentMode === "auslagern") renderAuslagern();
}

// ── ① EINLAGERN ───────────────────────────────────────────────
let el_slot = null, el_palette = null, el_orders = [], el_note = "";

function renderEinlagern() {
  const c = document.getElementById("modeContent");
  c.innerHTML = `
    <div class="card ${el_slot ? 'done' : ''}">
      <div class="card-title"><span class="step-badge">1</span> Zielplatz scannen</div>
      <div class="result-value ${!el_slot ? 'empty' : ''}">${el_slot ? keyToLabel(el_slot) : "Noch nicht gescannt"}</div>
      <button class="scan-btn" onclick="el_scanSlot()">📷 Platz scannen</button>
      <div class="manual-row">
        <input class="manual-input" id="el_manSlot" placeholder="z.B. 0_2 oder manuell eingeben" />
        <button class="manual-confirm" onclick="el_setSlotManual()">OK</button>
      </div>
    </div>

    <div class="card ${el_palette ? 'done' : ''}">
      <div class="card-title"><span class="step-badge">2</span> Palette / Ordernummer scannen</div>
      <div class="result-value ${!el_palette ? 'empty' : ''}">${el_palette || "Noch nicht gescannt"}</div>
      <button class="scan-btn" onclick="el_scanPalette()">📷 Palette scannen</button>
      <div class="manual-row">
        <input class="manual-input" id="el_manPalette" placeholder="Ordernummer oder Name" />
        <button class="manual-confirm" onclick="el_setPaletteManual()">OK</button>
      </div>
    </div>

    ${el_slot && el_palette ? `
    <button class="action-btn confirm" onclick="el_confirm()">✓ Einlagern bestätigen</button>
    ` : `
    <button class="action-btn confirm" disabled>✓ Einlagern bestätigen</button>
    `}
    <button class="action-btn reset" onclick="el_reset()">↺ Zurücksetzen</button>
  `;
}

window.el_scanSlot = () => startScan("Regalplatz-QR scannen", raw => {
  const p = parseQR(raw);
  if (p && p.type === "slot") { el_slot = p.value; toast("Platz erkannt: " + keyToLabel(el_slot), "success"); }
  else { el_slot = raw; toast("Platz gesetzt: " + raw); }
  renderEinlagern();
});
window.el_scanPalette = () => startScan("Paletten-QR oder Barcode scannen", raw => {
  const p = parseQR(raw);
  el_palette = p ? p.value : raw;
  toast("Palette: " + el_palette, "success");
  renderEinlagern();
});
window.el_setSlotManual = () => {
  const v = document.getElementById("el_manSlot")?.value.trim();
  if (v) { el_slot = v; renderEinlagern(); }
};
window.el_setPaletteManual = () => {
  const v = document.getElementById("el_manPalette")?.value.trim();
  if (v) { el_palette = v; renderEinlagern(); }
};
window.el_confirm = async () => {
  if (!el_slot || !el_palette) return;
  const existing = getSlotByKey(el_slot);
  const orders = existing ? [...(existing.orders||[]), el_palette] : [el_palette];
  const payload = { name: existing?.name || "", orders, note: existing?.note || "", color: existing?.color || "#DFC07A" };
  await saveSlot(el_slot, payload);
  toast("✓ " + el_palette + " eingelagert auf " + keyToLabel(el_slot), "success");
  el_slot = null; el_palette = null;
  renderEinlagern();
};
window.el_reset = () => { el_slot = null; el_palette = null; renderEinlagern(); };

// ── ② UMLAGERN ────────────────────────────────────────────────
let um_src = null, um_palette = null, um_dst = null;

function renderUmlagern() {
  const srcData = um_src ? getSlotByKey(um_src) : null;
  const c = document.getElementById("modeContent");
  c.innerHTML = `
    <div class="card ${um_src ? 'done' : ''}">
      <div class="card-title"><span class="step-badge">1</span> Quellplatz scannen</div>
      <div class="result-value ${!um_src ? 'empty' : ''}">${um_src ? keyToLabel(um_src) : "Noch nicht gescannt"}</div>
      ${srcData ? `<div class="slot-info occupied">
        <div class="slot-info-label">Aktueller Inhalt</div>
        ${srcData.name ? `<strong>${srcData.name}</strong><br>` : ''}
        ${(srcData.orders||[]).join(", ")}
      </div>` : ''}
      <button class="scan-btn" onclick="um_scanSrc()">📷 Quellplatz scannen</button>
      <div class="manual-row">
        <input class="manual-input" id="um_manSrc" placeholder="Platz-ID (z.B. 0_2)" />
        <button class="manual-confirm" onclick="um_setSrcManual()">OK</button>
      </div>
    </div>

    <div class="card ${um_palette !== null ? 'done' : ''}">
      <div class="card-title"><span class="step-badge">2</span> Palette auswählen</div>
      <div class="result-value ${um_palette === null ? 'empty' : ''}">${um_palette !== null ? um_palette : "Noch nicht gewählt"}</div>
      <button class="scan-btn" onclick="um_scanPalette()">📷 Palette scannen</button>
      ${srcData && (srcData.orders||[]).length > 0 ? `
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
        ${(srcData.orders||[]).map(o => `<button class="scan-btn secondary" onclick="um_setPalette('${o}')">${o}</button>`).join('')}
      </div>` : ''}
    </div>

    <div class="transfer-arrow">↓</div>

    <div class="card ${um_dst ? 'done' : ''}">
      <div class="card-title"><span class="step-badge">3</span> Zielplatz scannen</div>
      <div class="result-value ${!um_dst ? 'empty' : ''}">${um_dst ? keyToLabel(um_dst) : "Noch nicht gescannt"}</div>
      <button class="scan-btn" onclick="um_scanDst()">📷 Zielplatz scannen</button>
      <div class="manual-row">
        <input class="manual-input" id="um_manDst" placeholder="Platz-ID (z.B. 2_4)" />
        <button class="manual-confirm" onclick="um_setDstManual()">OK</button>
      </div>
    </div>

    ${um_src && um_palette !== null && um_dst ? `
    <button class="action-btn confirm" onclick="um_confirm()">🔄 Umlagern bestätigen</button>
    ` : `
    <button class="action-btn confirm" disabled>🔄 Umlagern bestätigen</button>
    `}
    <button class="action-btn reset" onclick="um_reset()">↺ Zurücksetzen</button>
  `;
}

window.um_scanSrc = () => startScan("Quellplatz-QR scannen", raw => {
  const p = parseQR(raw);
  um_src = (p && p.type === "slot") ? p.value : raw;
  um_palette = null; um_dst = null;
  toast("Quellplatz: " + keyToLabel(um_src), "success");
  renderUmlagern();
});
window.um_scanPalette = () => startScan("Paletten-QR scannen", raw => {
  const p = parseQR(raw);
  um_palette = p ? p.value : raw;
  toast("Palette: " + um_palette, "success");
  renderUmlagern();
});
window.um_setPalette = (v) => { um_palette = v; renderUmlagern(); };
window.um_scanDst = () => startScan("Zielplatz-QR scannen", raw => {
  const p = parseQR(raw);
  um_dst = (p && p.type === "slot") ? p.value : raw;
  toast("Zielplatz: " + keyToLabel(um_dst), "success");
  renderUmlagern();
});
window.um_setSrcManual = () => { const v = document.getElementById("um_manSrc")?.value.trim(); if(v){um_src=v;renderUmlagern();} };
window.um_setDstManual = () => { const v = document.getElementById("um_manDst")?.value.trim(); if(v){um_dst=v;renderUmlagern();} };

window.um_confirm = async () => {
  if (!um_src || um_palette === null || !um_dst) return;
  const srcData = getSlotByKey(um_src);
  if (!srcData) { toast("Quellplatz ist leer", "error"); return; }

  // Remove palette from source
  const newSrcOrders = (srcData.orders || []).filter(o => o !== um_palette);
  const srcEmpty = !srcData.name && newSrcOrders.length === 0;
  await saveSlot(um_src, srcEmpty ? null : { ...srcData, orders: newSrcOrders, color: newSrcOrders.length === 0 ? "#B5D4F4" : srcData.color });

  // Add palette to destination
  const dstData = getSlotByKey(um_dst) || {};
  const newDstOrders = [...(dstData.orders || []), um_palette];
  await saveSlot(um_dst, { name: dstData.name || "", orders: newDstOrders, note: dstData.note || "", color: "#DFC07A" });

  toast("✓ " + um_palette + " → " + keyToLabel(um_dst), "success");
  um_src = null; um_palette = null; um_dst = null;
  renderUmlagern();
};
window.um_reset = () => { um_src = null; um_palette = null; um_dst = null; renderUmlagern(); };

// ── ③ AUSLAGERN ───────────────────────────────────────────────
let aus_slot = null, aus_palette = null;

function renderAuslagern() {
  const slotData = aus_slot ? getSlotByKey(aus_slot) : null;
  const c = document.getElementById("modeContent");
  c.innerHTML = `
    <div class="card ${aus_slot ? 'done' : ''}">
      <div class="card-title"><span class="step-badge">1</span> Platz scannen</div>
      <div class="result-value ${!aus_slot ? 'empty' : ''}">${aus_slot ? keyToLabel(aus_slot) : "Noch nicht gescannt"}</div>
      ${slotData ? `<div class="slot-info occupied">
        <div class="slot-info-label">Inhalt</div>
        ${slotData.name ? `<strong>${slotData.name}</strong><br>` : ''}
        ${(slotData.orders||[]).join(", ")}
      </div>` : ''}
      <button class="scan-btn" onclick="aus_scanSlot()">📷 Platz scannen</button>
      <div class="manual-row">
        <input class="manual-input" id="aus_manSlot" placeholder="Platz-ID" />
        <button class="manual-confirm" onclick="aus_setSlotManual()">OK</button>
      </div>
    </div>

    <div class="card ${aus_palette !== null ? 'done' : ''}">
      <div class="card-title"><span class="step-badge">2</span> Palette wählen</div>
      <div class="result-value ${aus_palette === null ? 'empty' : ''}">${aus_palette !== null ? aus_palette : "Noch nicht gewählt"}</div>
      <button class="scan-btn" onclick="aus_scanPalette()">📷 Palette scannen</button>
      ${slotData && (slotData.orders||[]).length > 0 ? `
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
        <button class="scan-btn secondary" onclick="aus_setPalette('__ALL__')">Gesamten Platz auslagern</button>
        ${(slotData.orders||[]).map(o => `<button class="scan-btn secondary" onclick="aus_setPalette('${o}')">${o}</button>`).join('')}
      </div>` : ''}
    </div>

    ${aus_slot && aus_palette !== null ? `
    <button class="action-btn confirm" onclick="aus_confirm()">🚚 Auslagern bestätigen</button>
    ` : `
    <button class="action-btn confirm" disabled>🚚 Auslagern bestätigen</button>
    `}
    <button class="action-btn reset" onclick="aus_reset()">↺ Zurücksetzen</button>
  `;
}

window.aus_scanSlot = () => startScan("Platz-QR scannen", raw => {
  const p = parseQR(raw); aus_slot = (p && p.type==="slot") ? p.value : raw; aus_palette = null;
  toast("Platz: " + keyToLabel(aus_slot), "success"); renderAuslagern();
});
window.aus_scanPalette = () => startScan("Paletten-QR scannen", raw => {
  const p = parseQR(raw); aus_palette = p ? p.value : raw;
  toast("Palette: " + aus_palette, "success"); renderAuslagern();
});
window.aus_setPalette = v => { aus_palette = v; renderAuslagern(); };
window.aus_setSlotManual = () => { const v = document.getElementById("aus_manSlot")?.value.trim(); if(v){aus_slot=v;renderAuslagern();} };

window.aus_confirm = async () => {
  if (!aus_slot || aus_palette === null) return;
  const slotData = getSlotByKey(aus_slot);
  if (aus_palette === "__ALL__") {
    await saveSlot(aus_slot, null);
    toast("✓ Platz " + keyToLabel(aus_slot) + " geleert", "success");
  } else {
    if (!slotData) { toast("Platz bereits leer", "error"); return; }
    const newOrders = (slotData.orders||[]).filter(o => o !== aus_palette);
    const isEmpty   = !slotData.name && newOrders.length === 0;
    await saveSlot(aus_slot, isEmpty ? null : { ...slotData, orders: newOrders, color: newOrders.length === 0 ? "#B5D4F4" : slotData.color });
    toast("✓ " + aus_palette + " ausgelagert", "success");
  }
  aus_slot = null; aus_palette = null; renderAuslagern();
};
window.aus_reset = () => { aus_slot = null; aus_palette = null; renderAuslagern(); };
</script>
</body>
</html>
